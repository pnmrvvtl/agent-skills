interface:
  display_name: "Match The Design"
  short_description: "Normalize any design source into a node tree, map every node, let a gate decide"
  default_prompt: "Use $pnmrvvtl-match-the-design to implement this design exactly: pick the adapter for the source (Figma API, Figma plugin export, PDF or screenshots) and state its ceiling, extract the node tree with scripts/extract.mjs, map every required node in design/<feature>.spec.json, implement, then run scripts/verify.mjs and report its verdict and every exception it prints."
